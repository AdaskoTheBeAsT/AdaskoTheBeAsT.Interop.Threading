name: Contract validation

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            mode: Windows
          - os: windows-latest
            mode: X86
          - os: ubuntu-latest
            mode: Portable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Validate contracts and native host architecture
        shell: pwsh
        run: ./scripts/Invoke-Validation.ps1 -Mode ${{ matrix.mode }}
      - name: Build benchmark scenarios
        if: matrix.mode == 'Windows'
        shell: pwsh
        run: |
          dotnet restore benchmarks/Threading.Benchmarks/Threading.Benchmarks.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build benchmarks/Threading.Benchmarks/Threading.Benchmarks.csproj -c Release --no-restore
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.mode }}
          path: |
            **/TestResults/*.trx
            .sarif/
